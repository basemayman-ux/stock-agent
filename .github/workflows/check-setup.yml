name: Setup check

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find eToro ids, check prices, candles, spreads, earnings, news
        working-directory: engine
        run: python check_setup.py
        env:
          ETORO_API_KEY: ${{ secrets.ETORO_API_KEY }}
          ETORO_USER_KEY: ${{ secrets.ETORO_USER_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Save instrument ids
        if: always()
        run: |
          git config user.name "stock-agent"
          git config user.email "stock-agent@users.noreply.github.com"
          git add docs/data
          if ! git diff --cached --quiet; then
            git commit -m "setup check $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
